<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key - Private Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            background: #16213e;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #0f3460;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo-icon {
            font-size: 28px;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: #0f3460;
            border: none;
            color: #eee;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .nav-btn:hover {
            background: #1a4a7a;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .url-bar {
            flex: 1;
            display: flex;
            gap: 8px;
        }

        .url-input {
            flex: 1;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            color: #eee;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .url-input:focus {
            border-color: #ffd700;
        }

        .url-input::placeholder {
            color: #888;
        }

        .go-btn {
            background: #ffd700;
            border: none;
            color: #1a1a2e;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .go-btn:hover {
            background: #ffed4a;
        }

        .privacy-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f3460;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
        }

        .privacy-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .browser-container {
            flex: 1;
            position: relative;
            background: #0f0f1a;
        }

        webview {
            width: 100%;
            height: 100%;
            border: none;
        }

        .status-bar {
            background: #16213e;
            padding: 8px 16px;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #0f3460;
            display: flex;
            justify-content: space-between;
        }

        .security-info {
            display: flex;
            gap: 20px;
        }

        .security-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .security-icon {
            color: #00ff88;
        }

        .new-tab-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .new-tab-logo {
            font-size: 72px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .new-tab-logo-icon {
            font-size: 80px;
        }

        .new-tagline {
            font-size: 18px;
            color: #888;
            margin-bottom: 32px;
        }

        .privacy-features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            max-width: 600px;
        }

        .feature-card {
            background: #0f3460;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-title {
            font-weight: bold;
            margin-bottom: 4px;
            color: #ffd700;
        }

        .feature-desc {
            font-size: 12px;
            color: #888;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="logo">
            <span class="logo-icon">🔑</span>
            <span>Key</span>
        </div>
        
        <div class="nav-buttons">
            <button class="nav-btn" id="backBtn" disabled>←</button>
            <button class="nav-btn" id="forwardBtn" disabled>→</button>
            <button class="nav-btn" id="refreshBtn">↻</button>
        </div>

        <div class="url-bar">
            <input type="text" class="url-input" id="urlInput" placeholder="Enter URL or search...">
            <button class="go-btn" id="goBtn">Go</button>
        </div>

        <div class="privacy-indicator">
            <div class="privacy-dot"></div>
            <span>Private Mode</span>
        </div>
    </div>

    <div class="browser-container" id="browserContainer">
        <div class="new-tab-page" id="newTabPage">
            <div class="new-tab-logo">
                <span class="new-tab-logo-icon">🔑</span>
                <span>Key</span>
            </div>
            <div class="new-tagline">Maximum Privacy. Zero Tracking.</div>
            
            <div class="privacy-features">
                <div class="feature-card">
                    <div class="feature-icon">🔒</div>
                    <div class="feature-title">No History</div>
                    <div class="feature-desc">Nothing is saved locally</div>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🚫</div>
                    <div class="feature-title">No Cookies</div>
                    <div class="feature-desc">All cookies blocked</div>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🛡️</div>
                    <div class="feature-title">DNS over HTTPS</div>
                    <div class="feature-desc">Encrypted DNS queries</div>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🎭</div>
                    <div class="feature-title">Tracking Blocked</div>
                    <div class="feature-desc">Ads & trackers blocked</div>
                </div>
            </div>
        </div>
        
        <webview id="webview" class="hidden" partition="incognito-session" 
                 webpreferences="contextIsolation=true, nodeIntegration=false, sandbox=true"></webview>
    </div>

    <div class="status-bar">
        <div class="security-info">
            <div class="security-item">
                <span class="security-icon">🔒</span>
                <span>Encrypted Connection</span>
            </div>
            <div class="security-item">
                <span class="security-icon">🎭</span>
                <span>Tracking Blocked</span>
            </div>
            <div class="security-item">
                <span class="security-icon">🗑️</span>
                <span>No Data Stored</span>
            </div>
        </div>
        <div id="connectionStatus">Ready</div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
